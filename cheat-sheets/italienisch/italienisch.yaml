---
title: Italienisch
hidden: true
description:
  Cheat Sheet zum Lernen der italienischen Sprache für deutschsprachige
  Lernende. Es deckt Aussprache, Grammatik, Zahlen und nützliche Sätze für den
  Alltag ab.
author: Rico Berger
keywords:
  - Italienisch
  - Italiano
  - Sprache lernen
pages:
  - title: Italienisch
    columns: 5
    sections:
      - title: Allgemein
        items:
          - |
            Italienisch (Italiano) ist eine romanische Sprache und wird von
            rund 85 Millionen Menschen gesprochen, unter anderem in Italien,
            in der Schweiz (Tessin und Graubünden), in San Marino und in der
            Vatikanstadt.
          - |
            Dieses Cheat Sheet richtet sich an deutschsprachige Lernende und
            konzentriert sich auf das **Standarditalienisch**, wie es in ganz
            Italien verstanden wird.
          - |
            Download Cheat Sheet as [PDF](./assets/italienisch-cheat-sheet.pdf) | [PNG](./assets/italienisch-cheat-sheet.png)
      - title: Aussprache
        items:
          - "`c` - vor `e`/`i` wie »tsch« (z. B. `ciao` = hallo, `cena` =
            Abendessen), sonst wie »k« (z. B. `casa` = Haus, `come` = wie)"
          - "`ch` - wie »k« (z. B. `che` = was, `chiesa` = Kirche)"
          - "`g` - vor `e`/`i` wie »dsch« (z. B. `gelato` = Eis, `giorno` =
            Tag), sonst wie »g« (z. B. `gatto` = Katze)"
          - "`gh` - wie »g« (z. B. `spaghetti`, `ghiaccio` = Eis)"
          - "`gn` - wie »nj« in Kognak (z. B. `bagno` = Bad, `signore` = Herr)"
          - "`gli` - wie »lj« (z. B. `famiglia` = Familie, `figlio` = Sohn)"
          - "`sc` - vor `e`/`i` wie »sch« (z. B. `pesce` = Fisch, `uscita` =
            Ausgang), sonst wie »sk« (z. B. `scusa` = Entschuldigung)"
          - "`sch` - wie »sk« (z. B. `bruschetta`, `schiuma` = Schaum)"
          - "`z` - wie »ts« oder »ds« (z. B. `pizza`, `grazie` = danke, `zero` =
            null)"
          - "`s` - zwischen Vokalen stimmhaft wie in Rose (z. B. `casa`,
            `chiesa`)"
          - "`h` - immer stumm (z. B. `ho` = ich habe, `hotel`)"
          - "`qu` - wie »ku« (z. B. `quando` = wann, `questo` = dieser)"
          - "`r` - gerollt (z. B. `rosso` = rot, `mare` = Meer)"
          - Doppelkonsonanten werden lang und betont gesprochen (z. B. `nonna` =
            Großmutter, `palla` = Ball)
        tip:
          description:
            "**Tipp:** Italienische Wörter werden meist auf der vorletzten Silbe
            betont. Ein Akzent zeigt die Betonung der letzten Silbe an (z. B.
            `città` = Stadt, `caffè` = Kaffee, `però` = aber)."
      - title: Das Alphabet
        items:
          - |
            Das italienische Alphabet hat nur **21 Grundbuchstaben**. Die
            Buchstaben `j`, `k`, `w`, `x` und `y` kommen nur in Fremdwörtern
            vor.
          - "`A - B - C - D - E` - a - bi - tschi - di - e"
          - "`F - G - H - I` - effe - dschi - akka - i"
          - "`L - M - N - O` - elle - emme - enne - o"
          - "`P - Q - R - S - T` - pi - ku - erre - esse - ti"
          - "`U - V - Z` - u - wi/wu - dseta"
          - "`la lettera` - der Buchstabe"
          - "`l'alfabeto` - das Alphabet"
          - "`Come si scrive?` - Wie schreibt man das?"
        tip:
          description:
            "**Tipp:** Das italienische Alphabet hat nur **5 Vokale**. Diese
            werden fast immer gleich und ähnlich wie im Deutschen ausgesprochen:"
          items:
            - "`a`, `e` - a, e (wie »e« in See)"
            - "`i`, `o` - i, o (wie »o« in Gott)"
            - "`u` - u"
      - title: Begrüßung & Höflichkeit
        items:
          - "`Ciao` - Hallo / Tschüss (informell)"
          - "`Salve` - Hallo (neutral)"
          - "`Buongiorno` - Guten Morgen / Guten Tag"
          - "`Buonasera` - Guten Abend"
          - "`Buonanotte` - Gute Nacht"
          - "`Arrivederci` - Auf Wiedersehen"
          - "`A presto` - Bis bald"
          - "`A dopo` - Bis später"
          - "`A domani` - Bis morgen"
          - "`Per favore` / `Per piacere` - Bitte"
          - "`Grazie` - Danke"
          - "`Grazie mille` - Vielen Dank"
          - "`Prego` - Gern geschehen / Bitte sehr"
          - "`Scusi` - Entschuldigung (formell)"
          - "`Scusa` - Entschuldigung (informell, zu `tu`)"
          - "`Permesso` - Entschuldigung (um vorbeizugehen / beim Eintreten)"
          - "`Sì` - Ja"
          - "`No` - Nein"
          - "`Forse` - Vielleicht"
        tip:
          description:
            "**Tipp:** `Prego` ist vielseitig: Es bedeutet »Gern geschehen«,
            »Bitte sehr« (beim Überreichen), »Bitte nach Ihnen« oder als Frage
            »Wie bitte?«."
      - title: Sich vorstellen
        items:
          - "`Come ti chiami?` - Wie heißt du?"
          - "`Come si chiama?` - Wie heißen Sie?"
          - "`Mi chiamo ...` - Ich heiße ..."
          - "`Il mio nome è ...` - Mein Name ist ..."
          - "`Lui è ...` - Das ist (wörtl. Er ist) ..."
          - "`Qual è il Suo cognome?` - Wie ist Ihr Nachname?"
          - "`Il mio cognome è ...` - Mein Nachname ist ..."
          - "`Piacere` - Sehr erfreut / Freut mich"
          - "`Piacere di conoscerti` - Schön, dich kennenzulernen"
          - "`Come stai?` - Wie geht es dir?"
          - "`Come sta?` - Wie geht es Ihnen?"
          - "`Sto bene, grazie` - Mir geht es gut, danke"
          - "`E tu?` / `E Lei?` - Und dir? / Und Ihnen?"
          - "`Di dove sei?` - Woher kommst du?"
          - "`Vengo dalla Germania` - Ich komme aus Deutschland"
          - "`Sono tedesco` / `Sono tedesca` - Ich bin Deutscher / Deutsche"
          - "`Quanti anni hai?` - Wie alt bist du?"
          - "`Ho ... anni` - Ich bin ... Jahre alt"
        tip:
          description:
            "**Tipp:** Die Höflichkeitsform ist `Lei` mit dem Verb in der 3.
            Person Singular – unabhängig davon, ob man mit einem Mann oder einer
            Frau spricht (z. B. `Lei come si chiama?`)."
      - title: Verständigung
        items:
          - "`Parla tedesco?` - Sprechen Sie Deutsch?"
          - "`Parla inglese?` - Sprechen Sie Englisch?"
          - "`Parlo un po' d'italiano` - Ich spreche ein wenig Italienisch"
          - "`Non parlo italiano` - Ich spreche kein Italienisch"
          - "`Non capisco` - Ich verstehe nicht"
          - "`Non ho capito` - Ich habe nicht verstanden"
          - "`Capisce?` - Verstehen Sie?"
          - "`Può ripetere, per favore?` - Können Sie das wiederholen?"
          - "`Può parlare più lentamente?` - Können Sie langsamer sprechen?"
          - "`Più lentamente, per favore` - Langsamer, bitte"
          - "`Cosa significa ...?` - Was bedeutet ...?"
          - "`Come si dice ... in italiano?` - Wie sagt man ... auf Italienisch?"
        tip:
          description:
            "**Tipp:** Fragen erkennt man oft nur an der Satzmelodie: Am Ende
            einer Aussage fällt die Intonation, am Ende einer Frage steigt sie
            (`Giulia parla inglese.` vs. `Giulia parla inglese?`)."
      - title: Länder & Sprachen
        items:
          - "`tedesco` / `tedesca` - deutsch / Deutsche(r)"
          - "`inglese` - englisch / Engländer(in)"
          - "`francese` - französisch / Franzose (Französin)"
          - "`spagnolo` / `spagnola` - spanisch / Spanier(in)"
          - "`italiano` / `italiana` - italienisch / Italiener(in)"
          - "`americano` / `americana` - amerikanisch / Amerikaner(in)"
          - "`cinese` - chinesisch / Chinese (Chinesin)"
          - "`giapponese` - japanisch / Japaner(in)"
          - "`la Germania` - Deutschland"
          - "`l'Italia` - Italien"
          - "`l'Austria` - Österreich"
          - "`la Svizzera` - die Schweiz"
          - "`gli Stati Uniti` - die Vereinigten Staaten"
          - "`Parlo solo tedesco` - Ich spreche nur Deutsch"
          - "`Parlate inglese?` - Sprecht ihr Englisch?"
          - "`Vivo in Germania` - Ich lebe in Deutschland"
          - "`Abito a Roma` - Ich wohne in Rom"
        tip:
          description:
            "**Tipp:** Sprachen und Nationalitäten schreibt man klein; Formen
            auf `-ese` gelten für männlich und weiblich (`inglese`, `cinese`).
            Herkunft mit `essere` + `di` + Stadt (`Sono di Berlino`) oder
            `venire` + `da` + Land (`Vengo dalla Germania`). Wohnort mit `a` +
            Stadt (`Abito a Roma`) und `in` + Land (`Vivo in Italia`)."
      - title: Fragewörter
        items:
          - "`Chi?` - Wer?"
          - "`Che cosa?` / `Cosa?` / `Che?` - Was?"
          - "`Quando?` - Wann?"
          - "`Dove?` - Wo? / Wohin?"
          - "`Di dove?` - Woher? (Herkunft)"
          - "`Da dove?` - Woher? (Richtung)"
          - "`Perché?` - Warum?"
          - "`perché` - weil"
          - "`Come?` - Wie?"
          - "`Quale?` - Welche(r)?"
          - "`Quanto?` - Wie viel?"
          - "`Quanti?` / `Quante?` - Wie viele?"
        tip:
          description:
            "**Tipp:** `perché` bedeutet sowohl »warum« als auch »weil« (z. B.
            `Perché studi l'italiano?` – `Perché amo l'Italia`)."
      - title: Personalpronomen
        items:
          - "`io` - ich"
          - "`tu` - du (informell)"
          - "`Lei` - Sie (formell, Singular)"
          - "`lui` / `lei` - er / sie"
          - "`noi` - wir"
          - "`voi` - ihr"
          - "`loro` - sie (Plural)"
        tip:
          description:
            "**Tipp:** Subjektpronomen werden meist weggelassen, da die
            Verbendung die Person eindeutig anzeigt (`Parlo italiano` statt `Io
            parlo italiano`). Sie stehen nur zur Betonung."
      - title: Possessivpronomen
        items:
          - "`il mio` / `la mia` - mein"
          - "`il tuo` / `la tua` - dein"
          - "`il suo` / `la sua` - sein / ihr"
          - "`il Suo` / `la Sua` - Ihr (formell)"
          - "`il nostro` / `la nostra` - unser"
          - "`il vostro` / `la vostra` - euer"
          - "`il loro` / `la loro` - ihr (Plural)"
        tip:
          description:
            "**Tipp:** Possessivpronomen stehen fast immer MIT Artikel (`la mia
            casa`). Ausnahme: einzelne Familienmitglieder in der Einzahl (`mia
            madre`, `mio fratello` – aber `la loro madre` und `i miei
            fratelli`)."
      - title: Possessivpronomen (Mehrzahl)
        items:
          - "`i miei` / `le mie` - meine"
          - "`i tuoi` / `le tue` - deine"
          - "`i suoi` / `le sue` - seine / ihre"
          - "`i nostri` / `le nostre` - unsere"
          - "`i vostri` / `le vostre` - eure"
          - "`i loro` / `le loro` - ihre"
        tip:
          description:
            "**Tipp:** Possessivpronomen richten sich nach Geschlecht und Zahl
            der besessenen Sache (z. B. `i miei amici` = meine Freunde, `le mie
            amiche` = meine Freundinnen). `loro` selbst ist unveränderlich, nur
            der Artikel ändert sich."
      - title: Nomen
        items:
          - "`il libro` / `i libri` - das Buch / die Bücher"
          - "`la casa` / `le case` - das Haus / die Häuser"
          - "`il cane` / `i cani` - der Hund / die Hunde"
          - "`la stazione` / `le stazioni` - der Bahnhof / die Bahnhöfe"
          - "`l'amico` / `gli amici` - der Freund / die Freunde"
          - "`l'amica` / `le amiche` - die Freundin / die Freundinnen"
          - "`il cuoco` / `i cuochi` - der Koch / die Köche"
          - "`un caffè` / `due caffè` - ein Kaffee / zwei Kaffee"
          - "`una città` / `due città` - eine Stadt / zwei Städte"
          - "`il bar` / `i bar` - die Bar / die Bars"
        tip:
          description: "**Regeln für Geschlecht und Mehrzahl:**"
          items:
            - "`-o` → `-i`: meist männlich (`il libro` → `i libri`)"
            - "`-a` → `-e`: meist weiblich (`la casa` → `le case`)"
            - "`-e` → `-i`: männlich oder weiblich, Geschlecht mitlernen (`il
              cane`, `la stazione`)"
            - "`-ca` / `-co` → `-che` / `-chi`: mit `h`, damit die Aussprache
              erhalten bleibt (`amiche`, `cuochi`) – aber: `amici`, `medici`"
            - "Betonter Endvokal oder Fremdwort: unveränderlich (`caffè`,
              `città`, `bar`); Nomen auf Konsonant sind meist männlich"
      - title: Bestimmte Artikel
        items:
          - "`il` - der (männl. Singular, z. B. `il libro`)"
          - "`lo` - der (männl. vor `s`+Konsonant, `z`, `gn`, `ps`, `y`, z. B.
            `lo studente`, `lo zaino`)"
          - "`la` - die (weibl. Singular, z. B. `la casa`)"
          - "`l'` - der / die (vor Vokal, z. B. `l'amico`, `l'amica`)"
          - "`i` - die (männl. Plural, z. B. `i libri`)"
          - "`gli` - die (männl. Plural vor Vokal, `s`+Konsonant, `z`, ..., z.
            B. `gli studenti`, `gli amici`)"
          - "`le` - die (weibl. Plural, z. B. `le case`)"
        tip:
          description:
            "**Tipp:** Die Wahl des Artikels hängt vom Anlaut des folgenden
            Wortes ab. Lerne jedes Substantiv am besten immer zusammen mit
            seinem Artikel."
      - title: Unbestimmte Artikel
        items:
          - "`un` - ein (männl., z. B. `un libro`, `un amico`)"
          - "`uno` - ein (männl. vor `s`+Konsonant, `z`, ..., z. B. `uno
            studente`, `uno zaino`)"
          - "`una` - eine (weibl., z. B. `una casa`)"
          - "`un'` - eine (weibl. vor Vokal, z. B. `un'amica`)"
        tip:
          description:
            "**Tipp:** Vor Vokal steht männlich `un` ohne Apostroph (`un
            amico`), weiblich `un'` mit Apostroph (`un'amica`)."
      - title: Präpositionen
        items:
          - "`di` - von / aus"
          - "`a` - zu / nach / in (bei Städten)"
          - "`da` - von / aus / bei / seit"
          - "`in` - in / nach (bei Ländern)"
          - "`con` - mit"
          - "`su` - auf / über"
          - "`per` - für / nach (Richtung)"
          - "`tra` / `fra` - zwischen / in (zeitlich)"
          - "`senza` - ohne"
          - "`fino a` - bis"
          - "`dopo` - nach (zeitlich)"
          - "`prima di` - vor (zeitlich)"
      - title: Ortspräpositionen & Verkehrsmittel
        items:
          - "`a Roma` / `in Italia` / `in Toscana` - in / nach Rom, Italien, der
            Toskana (Stadt mit `a`, Land / Region meist mit `in`)"
          - "`a casa` / `a scuola` / `a cena` - zu / nach Hause, in die / in der
            Schule, beim / zum Abendessen"
          - "`in vacanza` / `in albergo` / `in campeggio` - im Urlaub, im Hotel,
            auf dem Campingplatz"
          - "`in montagna` / `in spiaggia` / `al mare` - in den Bergen / in die
            Berge, am / an den Strand, am / ans Meer"
          - "`in macchina` / `in treno` / `in autobus` - mit dem Auto / Zug /
            Bus"
          - "`in metro` / `in bicicletta` / `a piedi` - mit der U-Bahn / dem
            Fahrrad / zu Fuß"
          - "`vicino a` / `lontano da` - in der Nähe von / weit weg von"
          - "`davanti a` / `dietro a` / `accanto a` - vor / hinter / neben"
          - "`di fronte a` / `tra ... e ...` - gegenüber von / zwischen ... und
            ..."
          - "`La farmacia è accanto alla banca` - Die Apotheke ist neben der
            Bank"
        tip:
          description:
            "**Tipp:** Viele Ortsangaben sind feste Wendungen. Dieselbe
            Präposition kann Ort und Ziel ausdrücken (`Sono in spiaggia` / `Vado
            in spiaggia`). `Andare` bedeutet je nach Verkehrsmittel gehen,
            fahren oder fliegen."
      - title: Kontraktionen
        items:
          - "`di` + `il` = `del` - von dem"
          - "`di` + `la` = `della` - von der"
          - "`a` + `il` = `al` - zu dem"
          - "`a` + `la` = `alla` - zu der"
          - "`a` + `l'` = `all'` - zu dem / zu der"
          - "`a` + `lo` = `allo` - zu dem"
          - "`a` + `i` = `ai` - zu den"
          - "`a` + `gli` = `agli` - zu den"
          - "`da` + `il` = `dal` - von dem"
          - "`da` + `la` = `dalla` - von der"
          - "`in` + `il` = `nel` - in dem"
          - "`in` + `la` = `nella` - in der"
          - "`su` + `il` = `sul` - auf dem"
          - "`su` + `la` = `sulla` - auf der"
          - "`a` + `le` = `alle` - zu den"
          - "`di` + `gli` = `degli` - von den"
          - "`Vado al mare` - Ich fahre ans Meer"
        tip:
          description:
            "**Tipp:** Die Präpositionen `di`, `a`, `da`, `in` und `su`
            verschmelzen immer mit dem bestimmten Artikel. `con` und `per`
            bleiben getrennt (`con il treno`)."
      - title: Teilungsartikel
        items:
          - "`del pane` - etwas Brot (`di` + `il`)"
          - "`dello zucchero` - etwas Zucker (`di` + `lo`)"
          - "`della frutta` - etwas Obst (`di` + `la`)"
          - "`dell'acqua` - etwas Wasser (`di` + `l'`)"
          - "`dei pomodori` - einige Tomaten (`di` + `i`)"
          - "`degli spaghetti` - etwas Spaghetti (`di` + `gli`)"
          - "`delle mele` - einige Äpfel (`di` + `le`)"
          - "`Vorrei del pane e delle olive` - Ich hätte gern Brot und Oliven"
        tip:
          description:
            "**Tipp:** Teilungsartikel bezeichnen eine unbestimmte Menge oder
            Anzahl. Im Deutschen steht oft kein Artikel oder »etwas / einige«.
            Die Formen entsprechen `di` + bestimmtem Artikel, bedeuten hier aber
            nicht »von dem / von den«."
      - title: Mengenangaben
        items:
          - "`un chilo di pomodori` - ein Kilo Tomaten"
          - "`due chili di patate` - zwei Kilo Kartoffeln"
          - "`un litro d'acqua` / `due litri d'acqua` - ein Liter / zwei Liter
            Wasser"
          - "`un etto di formaggio` / `due etti di formaggio` - 100 Gramm / 200
            Gramm Käse"
          - "`mezzo chilo di mele` - ein halbes Kilo Äpfel"
          - "`mezza bottiglia d'acqua` - eine halbe Flasche Wasser"
          - "`un bicchiere di vino` - ein Glas Wein (Trinkglas)"
          - "`un barattolo di marmellata` - ein Glas Marmelade (Behälter)"
        tip:
          description:
            "**Tipp:** Maßeinheit / Behälter + `di` + Inhalt. Vor Vokal wird
            `di` oft zu `d'`. Bei Mengen über eins steht die Einheit im Plural
            (`due chili`, `tre litri`). Vor `mezzo` / `mezza` steht hier kein
            unbestimmter Artikel; die Form richtet sich nach der Einheit."
      - title: »C'è« & »Ci sono«
        items:
          - "`C'è un ristorante` - Es gibt ein Restaurant"
          - "`Ci sono due ristoranti` - Es gibt zwei Restaurants"
          - "`C'è una farmacia qui vicino?` - Gibt es hier in der Nähe eine
            Apotheke?"
          - "`Ci sono posti liberi?` - Gibt es freie Plätze?"
          - "`Non c'è acqua calda` - Es gibt kein warmes Wasser"
          - "`Non ci sono problemi` - Es gibt keine Probleme"
        tip:
          description:
            "**Tipp:** »Es gibt« heißt vor einem Nomen im Singular `c'è` (`ci` +
            `è`), im Plural `ci sono`. Frage und Aussage haben dieselbe
            Wortstellung."
      - title: Verb »essere« (sein)
        items:
          - "`io sono` - ich bin"
          - "`tu sei` - du bist"
          - "`lui / lei / Lei è` - er / sie ist, Sie sind"
          - "`noi siamo` - wir sind"
          - "`voi siete` - ihr seid"
          - "`loro sono` - sie sind"
        tip:
          description:
            "**Tipp:** `essere` ist unregelmäßig – Achtung: `sono` ist sowohl
            die Form für `io` als auch für `loro`. Man nutzt `essere` für
            Identität, Herkunft, Eigenschaften, Uhrzeit und Ortsangaben (z. B.
            `Sono tedesco`, `Sono le tre`, `Sono a Roma`)."
      - title: Verb »stare« (sich befinden)
        items:
          - "`io sto` - mir geht es / ich bleibe"
          - "`tu stai` - dir geht es"
          - "`lui / lei / Lei sta` - ihm / ihr geht es, Ihnen geht es"
          - "`noi stiamo` - uns geht es"
          - "`voi state` - euch geht es"
          - "`loro stanno` - ihnen geht es"
        tip:
          description:
            "**Tipp:** `stare` nutzt man für das Befinden (`Come stai?` – `Sto
            bene`) und die Verlaufsform (`Sto mangiando` = Ich esse gerade). Für
            Ortsangaben verwendet Italienisch meist `essere`."
      - title: Verb »avere« (haben)
        items:
          - "`io ho` - ich habe"
          - "`tu hai` - du hast"
          - "`lui / lei / Lei ha` - er / sie hat, Sie haben"
          - "`noi abbiamo` - wir haben"
          - "`voi avete` - ihr habt"
          - "`loro hanno` - sie haben"
        tip:
          description:
            "**Tipp:** Das `h` ist stumm. Viele Wendungen nutzen `avere` statt
            »sein«: `ho fame` (ich bin hungrig), `ho sete` (ich bin durstig),
            `ho ... anni` (ich bin ... Jahre alt)."
      - title: Verb »andare« (gehen)
        items:
          - "`io vado` - ich gehe"
          - "`tu vai` - du gehst"
          - "`lui / lei / Lei va` - er / sie geht, Sie gehen"
          - "`noi andiamo` - wir gehen"
          - "`voi andate` - ihr geht"
          - "`loro vanno` - sie gehen"
        tip:
          description:
            "**Tipp:** `andare a` + Stadt, `andare in` + Land (`Vado a Roma`,
            `Vado in Italia`). Die nahe Zukunft drückt man oft einfach mit dem
            Präsens aus (`Domani vado al mare` = Morgen fahre ich ans Meer)."
      - title: Verb »fare« (machen / tun)
        items:
          - "`io faccio` - ich mache"
          - "`tu fai` - du machst"
          - "`lui / lei / Lei fa` - er / sie macht, Sie machen"
          - "`noi facciamo` - wir machen"
          - "`voi fate` - ihr macht"
          - "`loro fanno` - sie machen"
          - "`fare colazione` - frühstücken"
          - "`fare la spesa` - Lebensmittel einkaufen"
          - "`fare una passeggiata` - einen Spaziergang machen"
          - "`fare una foto` - ein Foto machen"
        tip:
          description:
            "**Tipp:** `Fare` ist unregelmäßig und kommt in vielen festen
            Wendungen vor. `Fare la spesa` meint den Einkauf für den täglichen
            Bedarf; `fare shopping` bedeutet shoppen gehen."
      - title: Verb »bere« (trinken)
        items:
          - "`io bevo` - ich trinke"
          - "`tu bevi` - du trinkst"
          - "`lui / lei / Lei beve` - er / sie trinkt, Sie trinken"
          - "`noi beviamo` - wir trinken"
          - "`voi bevete` - ihr trinkt"
          - "`loro bevono` - sie trinken"
          - "`Bevo solo acqua` - Ich trinke nur Wasser"
          - "`Beviamo qualcosa?` - Trinken wir etwas?"
        tip:
          description:
            "**Tipp:** Trotz der Grundform `bere` lautet der Stamm im Präsens
            `bev-`; die Endungen entsprechen den regelmäßigen `-ere`-Verben."
      - title: Verb »chiamarsi« (heißen)
        items:
          - "`io mi chiamo` - ich heiße"
          - "`tu ti chiami` - du heißt"
          - "`lui / lei / Lei si chiama` - er / sie heißt, Sie heißen"
          - "`noi ci chiamiamo` - wir heißen"
          - "`voi vi chiamate` - ihr heißt"
          - "`loro si chiamano` - sie heißen"
          - "`Come ti chiami?` - Wie heißt du?"
        tip:
          description:
            "**Tipp:** In einfachen Aussagesätzen steht das Reflexivpronomen VOR
            dem konjugierten Verb (`mi chiamo`, `si chiama`)."
      - title: Reflexive Verben
        items:
          - "`mi` / `ti` / `si` / `ci` / `vi` / `si` - mich / dich / sich / uns
            / euch / sich"
          - "`sentirsi` - sich fühlen: `mi sento`, `ti senti`, `si sente`, `ci
            sentiamo`, `vi sentite`, `si sentono`"
          - "`svegliarsi` - aufwachen: `mi sveglio`, `ti svegli`, `si sveglia`,
            `ci svegliamo`, `vi svegliate`, `si svegliano`"
          - "`Come si sente?` - Wie fühlen Sie sich?"
          - "`Non mi sento bene` - Ich fühle mich nicht gut"
          - "`Ci svegliamo presto` - Wir wachen früh auf"
        tip:
          description:
            "**Tipp:** In der Grundform ersetzt `-si` das letzte `-e` (`sentire`
            → `sentirsi`). In einfachen Aussagesätzen steht das Pronomen vor dem
            Verb, bei Verneinung nach `non`. Nicht jedes italienische reflexive
            Verb ist auch im Deutschen reflexiv."
      - title: Verb »volere« (wollen)
        items:
          - "`io voglio` - ich will"
          - "`tu vuoi` - du willst"
          - "`lui / lei / Lei vuole` - er / sie will, Sie wollen"
          - "`noi vogliamo` - wir wollen"
          - "`voi volete` - ihr wollt"
          - "`loro vogliono` - sie wollen"
        tip:
          description:
            "**Tipp:** Höflicher ist das Konditional `vorrei` (ich möchte / ich
            hätte gern), z. B. `Vorrei un caffè` = Ich hätte gern einen Kaffee."
      - title: Verb »abitare« (wohnen)
        items:
          - "`io abito` - ich wohne"
          - "`tu abiti` - du wohnst"
          - "`lui / lei / Lei abita` - er / sie wohnt, Sie wohnen"
          - "`noi abitiamo` - wir wohnen"
          - "`voi abitate` - ihr wohnt"
          - "`loro abitano` - sie wohnen"
          - "`Dove abiti?` - Wo wohnst du?"
          - "`Abito a Trieste` - Ich wohne in Triest"
        tip:
          description:
            "**Tipp:** Wer `abitare` beherrscht, kann alle regelmäßigen Verben
            auf `-are` konjugieren – die Endungen sind immer dieselben (z. B.
            `parlare`, `lavorare`, `comprare`, `portare`)."
      - title: Verb »lavorare« (arbeiten)
        items:
          - "`io lavoro` - ich arbeite"
          - "`tu lavori` - du arbeitest"
          - "`lui / lei / Lei lavora` - er / sie arbeitet, Sie arbeiten"
          - "`noi lavoriamo` - wir arbeiten"
          - "`voi lavorate` - ihr arbeitet"
          - "`loro lavorano` - sie arbeiten"
          - "`Lavoro come giornalista` - Ich arbeite als Journalist(in)"
          - "`I miei colleghi lavorano molto` - Meine Kollegen arbeiten viel"
        tip:
          description:
            "**Tipp:** `lavorare` ist ein regelmäßiges Verb auf `-are` und wird
            genauso wie `abitare` konjugiert."
      - title: Regelmäßige Verben (Präsens)
        items:
          - "**-are** (`parlare` = sprechen): `parlo`, `parli`, `parla`,
            `parliamo`, `parlate`, `parlano`"
          - "**-ere** (`prendere` = nehmen): `prendo`, `prendi`, `prende`,
            `prendiamo`, `prendete`, `prendono`"
          - "**-ire** (`dormire` = schlafen): `dormo`, `dormi`, `dorme`,
            `dormiamo`, `dormite`, `dormono`"
          - "**-ire mit -isc-** (`capire` = verstehen): `capisco`, `capisci`,
            `capisce`, `capiamo`, `capite`, `capiscono`"
        tip:
          description:
            "**Tipp:** Die Endung des Infinitivs (`-are`/`-ere`/`-ire`) wird
            durch die Personalendung ersetzt; das Pronomen entfällt meist. Viele
            `-ire`-Verben (`capire`, `finire`, `preferire`) schieben `-isc-` ein
            – außer bei `noi` und `voi`."
      - title: Passato prossimo mit »avere«
        items:
          - "**Bildung:** Präsens von `avere` + Partizip Perfekt"
          - "`-are` → `-ato`: `prenotare` → `prenotato` (reserviert)"
          - "`-ere` → `-uto`: `ricevere` → `ricevuto` (erhalten)"
          - "`-ire` → `-ito`: `dormire` → `dormito` (geschlafen)"
          - "`Ho prenotato una camera` - Ich habe ein Zimmer reserviert"
          - "`Abbiamo mangiato al ristorante` - Wir haben im Restaurant gegessen"
          - "`Avete già pagato?` - Haben Sie schon bezahlt? (mehrere Personen)"
          - "`Non ho capito` - Ich habe nicht verstanden"
          - "**Häufige unregelmäßige Partizipien:** `fare` → `fatto`, `bere` →
            `bevuto`, `prendere` → `preso`, `vedere` → `visto`"
        tip:
          description:
            "**Tipp:** Das `passato prossimo` beschreibt abgeschlossene
            Handlungen in der Vergangenheit. Viele Verben bilden es mit `avere`;
            besonders bei `-ere`-Verben gibt es unregelmäßige Partizipien. In
            diesen einfachen Sätzen bleibt das Partizip unabhängig vom Subjekt
            unverändert."
      - title: Passato prossimo mit »essere«
        items:
          - "**Bildung:** Präsens von `essere` + Partizip Perfekt"
          - "`arrivare` → `arrivato` - ankommen → angekommen"
          - "`partire` → `partito` - abreisen → abgereist"
          - "`andare` → `andato` - gehen / fahren → gegangen / gefahren"
          - "`tornare` → `tornato` - zurückkommen → zurückgekommen"
          - "`uscire` → `uscito` - hinausgehen → hinausgegangen"
          - "`Sono arrivato` / `Sono arrivata` - Ich bin angekommen (männlich /
            weiblich)"
          - "`Siamo partiti` / `Siamo partite` - Wir sind abgereist (männlich /
            gemischt bzw. nur weiblich)"
          - "`A che ora sei arrivata?` - Um wie viel Uhr bist du angekommen? (zu
            einer Frau)"
          - "`Non siamo andati al mare` - Wir sind nicht ans Meer gefahren"
        tip:
          description:
            "**Tipp:** Mit `essere` passt sich das Partizip an das Subjekt an:
            `-o`, `-a`, `-i`, `-e`. Die genannten Reiseverben und reflexive
            Verben verwenden `essere`. Nicht jedes Bewegungsverb folgt dieser
            Regel (`ho camminato` = ich bin zu Fuß gegangen); das Hilfsverb
            deshalb mitlernen."
      - title: Verlaufsform mit »stare«
        items:
          - "**Bildung:** Präsens von `stare` + `gerundio presente`"
          - "`-are` → `-ando`: `aspettare` → `aspettando`"
          - "`-ere` → `-endo`: `scrivere` → `scrivendo`"
          - "`-ire` → `-endo`: `dormire` → `dormendo`"
          - "`Sto cercando la stazione` - Ich suche gerade den Bahnhof"
          - "`Stiamo aspettando l'autobus` - Wir warten gerade auf den Bus"
          - "`Cosa stai facendo?` - Was machst du gerade?"
          - "`Non sta dormendo` - Er / Sie schläft gerade nicht"
          - "**Unregelmäßig:** `fare` → `facendo`, `bere` → `bevendo`, `dire` →
            `dicendo`"
        tip:
          description:
            "**Tipp:** Die Form betont eine gerade ablaufende Handlung. Nur
            `stare` wird nach der Person konjugiert; das `gerundio` bleibt
            unverändert. Die Verneinung steht vor `stare`."
      - title: Die Verneinung
        items:
          - "`Non parlo russo` - Ich spreche kein Russisch"
          - "`Lei non è italiana` - Sie ist keine Italienerin"
          - "`Non abitano a Torino` - Sie wohnen nicht in Turin"
          - "`Non ho fame` - Ich habe keinen Hunger"
          - "`non ... mai` - nie: `Non bevo mai alcolici`"
          - "`non ... più` - nicht mehr: `Non ho più fame`"
          - "`non ... niente` - nichts: `Non mangio niente`"
          - "`non ... nessuno` - niemanden: `Non conosco nessuno qui`"
          - "`neanche` - auch nicht: `Non bevo birra e neanche vino`"
          - "`Non mi sento più stanco` - Ich fühle mich nicht mehr müde"
        tip:
          description:
            "**Tipp:** `Non` steht vor dem Verb bzw. vor einem zugehörigen
            Pronomen (`non mi sento`). Bei mehrteiliger Verneinung folgt der
            zweite Teil in diesen Beispielen nach dem Verb; die Bedeutung bleibt
            negativ. Steht `nessuno` oder `niente` bereits vor dem Verb,
            entfällt `non` (`Nessuno parla` = Niemand spricht)."
      - title: Häufigkeitsangaben
        items:
          - "`sempre` - immer"
          - "`spesso` - oft"
          - "`di solito` - normalerweise / gewöhnlich"
          - "`a volte` - manchmal"
          - "`raramente` - selten"
          - "`quasi mai` - fast nie (mit `non` vor dem Verb)"
          - "`Di solito faccio colazione alle otto` - Normalerweise frühstücke
            ich um acht"
          - "`Vado spesso in spiaggia` - Ich gehe oft an den Strand"
          - "`Bevo sempre acqua` - Ich trinke immer Wasser"
          - "`Non vado quasi mai in macchina` - Ich fahre fast nie mit dem Auto"
        tip:
          description:
            "**Tipp:** `Sempre` und `spesso` stehen meist nach dem konjugierten
            Verb; `di solito`, `a volte` und `raramente` können auch am
            Satzanfang stehen."
      - title: »Serve« & »Servono« (brauchen)
        items:
          - "`Serve un biglietto` - Man braucht eine Fahrkarte"
          - "`Servono due biglietti` - Man braucht zwei Fahrkarten"
          - "`Mi serve una coperta` - Ich brauche eine Decke"
          - "`Mi servono due asciugamani` - Ich brauche zwei Handtücher"
          - "`Ti serve aiuto?` - Brauchst du Hilfe?"
          - "`Non mi serve un sacchetto` - Ich brauche keine Tüte"
        tip:
          description:
            "**Tipp:** Bei `servire` ist die benötigte Sache das Subjekt:
            Singular `serve`, Plural `servono`. `Mi` heißt hier »mir«, `ti`
            heißt »dir«. Ohne diese Ergänzung beschreibt man, was allgemein
            benötigt wird."
