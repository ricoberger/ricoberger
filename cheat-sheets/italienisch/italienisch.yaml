      - title: Uhrzeit
        items:
          - "`Che ora è?` / `Che ore sono?` - Wie spät ist es?"
          - "`È l'una` - Es ist ein Uhr"
          - "`Sono le sette` - Es ist sieben Uhr"
          - "`Sono le sette e dieci` - Es ist zehn nach sieben (Stunde + `e` +
            Minuten)"
          - "`Sono le sei e mezza` - Es ist halb sieben (wörtl. sechs und halb)"
          - "`Sono le tre e un quarto` - Es ist Viertel nach drei"
          - "`È mezzogiorno` / `È mezzanotte` - Es ist Mittag / Mitternacht"
          - "`Sono le quattro meno un quarto` - Es ist Viertel vor vier"
          - "`Sono le due meno dieci` - Es ist zehn vor zwei"
          - "`Sono le venti` - Es ist zwanzig Uhr (offiziell)"
        tip:
          description:
            "**Tipp:** Bei `l'una`, `mezzogiorno` und `mezzanotte` steht die
            Einzahlform `è`, sonst die Mehrzahlform `sono le ...`. Minuten nach
            der Stunde verbindet `e` (und); ab etwa der 40. Minute zieht man sie
            mit `meno` (weniger) von der nächsten Stunde ab. In offiziellen
            Situationen nutzt man wie im Deutschen die Zahlen 0–24."
      - title: Uhrzeit mit »a«
        items:
          - "`A che ora?` - Um wie viel Uhr?"
          - "`a` + `l'una` = `all'una` - um ein Uhr"
          - "`a` + `le due` = `alle due` - um zwei Uhr"
          - "`a mezzogiorno` - am Mittag"
          - "`a mezzanotte` - um Mitternacht"
          - "`Domani a mezzogiorno e mezza` - Morgen um halb eins"
        tip:
          description:
            "**Tipp:** Den Zeitpunkt erfragt man mit `A che ora?`. Die
            Präposition `a` verschmilzt mit dem Artikel der Uhrzeit zu `all'`
            (vor `una`) bzw. `alle` (ab zwei). Vor `mezzogiorno` und
            `mezzanotte` steht nur `a`."
