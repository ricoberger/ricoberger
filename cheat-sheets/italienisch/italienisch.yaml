          - "`triste` - traurig"
          - "`malato` - krank"
          - "`contento` - zufrieden / froh"
          - "`intelligente` - intelligent"
        tip:
          description:
            "**Tipp:** Adjektive stehen meist nach dem Substantiv und passen
            sich in Geschlecht und Zahl an (z. B. `una casa bella`, `i libri
            nuovi`). Einige häufige Adjektive (`bello`, `buono`, `grande`)
            stehen oft davor."
      - title: Angleichung der Adjektive
        items:
          - "Endung `-o`/`-a` richtet sich nach dem Geschlecht: `il bambino
            stanco`, `la bambina stanca`"
          - "Adjektive auf `-e` sind im Geschlecht unveränderlich: `il bambino
            forte`, `la bambina forte`"
          - "Mehrzahl durch Vokalwechsel: `-o` → `-i`, `-a` → `-e`, `-e` → `-i`:
            `i bambini stanchi`, `le bambine stanche`, `i bambini forti`"
          - "`Lei è un po' stanca` - Sie ist ein bisschen müde"
          - "`Siete tristi o malati?` - Seid ihr traurig oder krank?"
          - "`I bambini sono forti e intelligenti` - Die Kinder sind stark und
            intelligent"
        tip:
          description:
            "**Tipp:** Die Mehrzahl wird nie mit `-s` gebildet, sondern durch
            Vokalwechsel – das gilt auch für Substantive (`la pizza` → `le
            pizze`). Bei `-co`/`-ca` wird oft ein `h` eingeschoben, damit die
            Aussprache »k« bleibt (`stanco` → `stanchi`)."
