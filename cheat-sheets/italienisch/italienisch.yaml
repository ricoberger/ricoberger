          - "`economico` - billig / günstig"
          - "`il negozio` - das Geschäft"
          - "`i soldi` - das Geld"
          - "`Posso pagare con la carta?` - Kann ich mit Karte zahlen?"
          - "`Dov'è ...?` - Wo ist ...?"
          - "`Sto solo guardando, grazie` - Ich schaue nur, danke"
          - "`Quant'è in tutto?` - Wie viel macht das zusammen?"
          - "`Ecco il resto` - Hier ist das Wechselgeld"
          - "`il resto` - das Wechselgeld"
      - title: Unterwegs
        items:
          - "`a sinistra` - links"
          - "`a destra` - rechts"
          - "`sempre dritto` - immer geradeaus"
          - "`vicino` - nah"
          - "`lontano` - weit"
          - "`qui` / `qua` - hier"
          - "`lì` / `là` - dort"
          - "`la stazione` - der Bahnhof"
          - "`l'aeroporto` - der Flughafen"
          - "`il treno` - der Zug"
          - "`l'autobus` - der Bus"
          - "`la fermata` - die Haltestelle"
          - "`il biglietto` - das Ticket"
          - "`il bagno` - die Toilette"
          - "`la strada` - die Straße"
          - "`il mare` - das Meer"
        tip:
          description:
            "**Tipp:** Bus- und Zugtickets muss man in Italien vor der Fahrt
            entwerten (`convalidare il biglietto`) – sonst drohen Bußgelder."
      - title: Notfall
        items:
          - "`Aiuto!` - Hilfe!"
          - "`Attenzione!` - Vorsicht!"
          - "`Chiami la polizia` - Rufen Sie die Polizei"
          - "`Ho bisogno di un medico` - Ich brauche einen Arzt"
          - "`Mi sono perso` / `Mi sono persa` - Ich habe mich verlaufen"
          - "`Non mi sento bene` - Mir geht es nicht gut"
          - "`la farmacia` - die Apotheke"
          - "`l'ospedale` - das Krankenhaus"
      - title: Adjektive
        items:
          - "`grande` - groß"
          - "`piccolo` - klein"
          - "`buono` / `cattivo` - gut / schlecht"
          - "`nuovo` / `vecchio` - neu / alt"
          - "`giovane` - jung"
          - "`bello` / `brutto` - schön / hässlich"
          - "`caro` / `economico` - teuer / billig"
          - "`caldo` / `freddo` - heiß / kalt"
          - "`facile` / `difficile` - einfach / schwierig"
          - "`molto` / `poco` - viel / wenig"
          - "`stanco` - müde"
          - "`forte` - stark"
          - "`triste` - traurig"
          - "`malato` - krank"
          - "`contento` - zufrieden / froh"
          - "`intelligente` - intelligent"
        tip:
          description:
            "**Tipp:** Adjektive stehen meist nach dem Substantiv und passen
            sich in Geschlecht und Zahl an (z. B. `una casa bella`, `i libri
            nuovi`). Einige häufige Adjektive (`bello`, `buono`, `grande`)
            stehen oft davor."
      - title: Angleichung der Adjektive
        items:
          - "Endung `-o`/`-a` richtet sich nach dem Geschlecht: `il bambino
            stanco`, `la bambina stanca`"
          - "Adjektive auf `-e` sind im Geschlecht unveränderlich: `il bambino
            forte`, `la bambina forte`"
          - "Mehrzahl durch Vokalwechsel: `-o` → `-i`, `-a` → `-e`, `-e` → `-i`:
            `i bambini stanchi`, `le bambine stanche`, `i bambini forti`"
          - "`Lei è un po' stanca` - Sie ist ein bisschen müde"
          - "`Siete tristi o malati?` - Seid ihr traurig oder krank?"
          - "`I bambini sono forti e intelligenti` - Die Kinder sind stark und
            intelligent"
        tip:
          description:
            "**Tipp:** Die Mehrzahl wird nie mit `-s` gebildet, sondern durch
            Vokalwechsel – das gilt auch für Substantive (`la pizza` → `le
            pizze`). Bei `-co`/`-ca` wird oft ein `h` eingeschoben, damit die
            Aussprache »k« bleibt (`stanco` → `stanchi`)."
      - title: Steigerung mit »più« & »meno«
        items:
          - "`più grande` / `più piccolo` - größer / kleiner"
          - "`più caro` / `meno caro` - teurer / weniger teuer"
          - "`una camera più tranquilla` - ein ruhigeres Zimmer"
          - "`una borsa più piccola` - eine kleinere Tasche"
          - "`due borse più piccole` - zwei kleinere Taschen"
          - "`Questa camera è più grande dell'altra` - Dieses Zimmer ist größer
            als das andere"
          - "`Vorrei qualcosa di meno caro` - Ich hätte gern etwas Günstigeres"
        tip:
          description:
            "**Tipp:** `Più` / `meno` + Adjektiv bildet die Steigerung. Das
            Adjektiv passt sich weiterhin an das Nomen an. Beim Vergleich zweier
            Personen oder Dinge verwendet man häufig `di` (`più grande di ...`);
            mit Artikel entsteht z. B. `dell'altra`."
      - title: Verb »piacere« (gefallen)
        items:
          - "`Mi piace la pizza` - Ich mag Pizza (wörtl. Mir gefällt Pizza)"
          - "`Mi piacciono gli spaghetti` - Ich mag Spaghetti"
          - "`Ti piace il gelato?` - Magst du Eis?"
          - "`Ti piacciono le olive?` - Magst du Oliven?"
          - "`Mi piace camminare` - Ich gehe gern zu Fuß"
          - "`Ti piace nuotare?` - Schwimmst du gern?"
          - "`Non mi piace guidare in città` - Ich fahre nicht gern in der Stadt
            Auto"
          - "`Mi piace molto` / `Mi piacciono molto` - Das mag ich sehr
            (Singular / Plural)"
        tip:
          description:
            "**Tipp:** Das Gemochte ist das Subjekt: `piace` bei einem Nomen im
            Singular oder einem Infinitiv, `piacciono` bei einem Nomen im
            Plural. `Mi` bedeutet »mir«, `ti` bedeutet »dir«. Für Tätigkeiten
            steht nach `piace` die Grundform des Verbs."
      - title: Nützliche Sätze
        items:
          - "`Tutto bene?` - Alles gut?"
          - "`Come va?` - Wie läuft's?"
          - "`Va bene` - In Ordnung / Okay"
          - "`Che bello!` - Wie schön!"
          - "`Certo` - Klar / Natürlich"
          - "`Non fa niente` - Macht nichts"
          - "`D'accordo` - Einverstanden"
          - "`Mi piace ...` - Ich mag ... (wörtl.: ... gefällt mir)"
          - "`Non mi piace ...` - Ich mag ... nicht"
          - "`Voglio ...` / `Non voglio ...` - Ich will ... / Ich will ... nicht"
          - "`Andiamo ...?` - Wollen wir ...? / Lass uns ... (z. B. `Andiamo a
            mangiare?` = Wollen wir essen gehen?)"
          - "`Posso ...?` - Darf ich ...?"
          - "`Può aiutarmi?` - Können Sie mir helfen?"
          - "`Dov'è il bagno?` - Wo ist die Toilette?"
      - title: Weitere Wörter
        items:
          - "`il libro` - das Buch"
          - "`la macchina` - das Auto"
          - "`il computer` - der Computer"
          - "`il nome` - der Name"
          - "`le vacanze` - die Ferien / der Urlaub"
          - "`la casa` - das Haus"
          - "`l'appartamento` - die Wohnung"
          - "`la città` - die Stadt"
          - "`anche` - auch"
          - "`tutto` - alles"
          - "`la cosa` - die Sache / das Ding"
          - "`solo` - nur"
          - "`già` - schon"
          - "`o` - oder"
          - "`e` / `ed` - und (`ed` vor Vokal, z. B. `Anna ed Erica`)"
          - "`ma` - aber"
          - "`invece` - hingegen / dagegen"
          - "`più` - mehr / plus"
          - "`meno` - weniger / minus"
          - "`uguale` - gleich (z. B. `dieci più dieci uguale venti`)"
          - "`molto` - sehr / viel"
          - "`bene` / `male` - gut / schlecht (Adverb)"
          - "`meglio` - besser"
          - "`giusto` - richtig"
          - "`per me` - für mich"
          - "`l'Italia` - Italien"
  - title: Italienisch im Urlaub
    columns: 5
    sections:
      - title: Schnell zurechtfinden
        items:
          - |
            Praktische Sätze für eine Reise nach Italien. `...` steht für
            einen Namen, Ort oder eine Zahl. Bei Fremden ist die
            Höflichkeitsform **Lei** eine gute Wahl; mit `avete` spricht man
            mehrere Personen an, etwa das Team eines Hotels oder Restaurants.
          - "`Buongiorno, scusi!` - Guten Tag, entschuldigen Sie!"
          - "`Vorrei ..., per favore` - Ich hätte gern ..., bitte"
          - "`Può aiutarmi, per favore?` - Können Sie mir bitte helfen?"
          - "`Dov'è il bagno?` - Wo ist die Toilette?"
          - "`Grazie per l'aiuto!` - Danke für die Hilfe!"
      - title: Verständigung unterwegs
        items:
          - "`Parlo solo un po' d'italiano` - Ich spreche nur ein wenig
            Italienisch"
          - "`Parla tedesco o inglese?` - Sprechen Sie Deutsch oder Englisch?"
          - "`Mi scusi, non ho capito` - Entschuldigung, ich habe nicht
            verstanden"
          - "`Può ripetere più lentamente?` - Können Sie das langsamer
            wiederholen?"
          - "`Può scriverlo, per favore?` - Können Sie das bitte aufschreiben?"
          - "`Come si pronuncia questa parola?` - Wie spricht man dieses Wort
            aus?"
          - "`Cosa significa questa parola?` - Was bedeutet dieses Wort?"
          - "`Un momento, per favore, uso il traduttore` - Einen Moment bitte,
            ich benutze die Übersetzungs-App"
      - title: Ankunft & Weiterfahrt
        items:
          - "`Dove posso ritirare il bagaglio?` - Wo kann ich mein Gepäck
            abholen?"
          - "`La mia valigia non è arrivata` - Mein Koffer ist nicht angekommen"
          - "`Dov'è la fermata della navetta?` - Wo ist die Haltestelle des
            Shuttlebusses?"
          - "`Come posso arrivare in centro?` - Wie komme ich ins Zentrum?"
          - "`Dove posso prendere un taxi?` - Wo bekomme ich ein Taxi?"
          - "`Quanto costa la corsa fino a questo indirizzo?` - Wie viel kostet
            die Fahrt zu dieser Adresse?"
          - "`Mi può portare a questo hotel?` - Können Sie mich zu diesem Hotel
            bringen?"
          - "`Può fermarsi qui, per favore?` - Können Sie bitte hier anhalten?"
      - title: Bus & Bahn
        items:
          - "`Vorrei due biglietti per Firenze` - Ich hätte gern zwei Fahrkarten
            nach Florenz"
          - "`Solo andata, per favore` - Nur Hinfahrt, bitte"
          - "`Andata e ritorno, per favore` - Hin- und Rückfahrt, bitte"
          - "`Da quale binario parte il treno per Roma?` - Von welchem Gleis
            fährt der Zug nach Rom ab?"
          - "`Questo autobus va in centro?` - Fährt dieser Bus ins Zentrum?"
          - "`A quale fermata devo scendere?` - An welcher Haltestelle muss ich
            aussteigen?"
          - "`Devo cambiare treno?` - Muss ich umsteigen?"
          - "`Devo convalidare questo biglietto?` - Muss ich diese Fahrkarte
            entwerten?"
          - "`Questo posto è libero?` - Ist dieser Platz frei?"
          - "`A che ora parte l'ultimo autobus?` - Wann fährt der letzte Bus?"
        tip:
          description:
            "**Tipp:** Ob eine Entwertung nötig ist, hängt von Ticketart und
            Anbieter ab. Beachte die Hinweise auf dem Ticket bzw. in der App."
      - title: Nach dem Weg fragen
        items:
          - "`Scusi, dov'è la stazione?` - Entschuldigung, wo ist der Bahnhof?"
          - "`C'è una farmacia qui vicino?` - Gibt es hier in der Nähe eine
            Apotheke?"
          - "`Come si arriva al museo?` - Wie kommt man zum Museum?"
          - "`È lontano da qui?` - Ist es weit von hier?"
          - "`Quanto tempo ci vuole a piedi?` - Wie lange braucht man zu Fuß?"
          - "`Può indicarmi la strada sulla mappa?` - Können Sie mir den Weg auf
            der Karte zeigen?"
          - "`Devo girare a destra o a sinistra?` - Muss ich rechts oder links
            abbiegen?"
          - "`Deve andare dritto fino al semaforo` - Sie müssen bis zur Ampel
            geradeaus gehen"
          - "`La fermata è davanti alla banca` - Die Haltestelle ist vor der
            Bank"
          - "`Il museo è vicino alla piazza` - Das Museum ist in der Nähe des
            Platzes"
      - title: Mit dem Auto
        items:
          - "`Vorrei noleggiare una macchina per tre giorni` - Ich möchte für
            drei Tage ein Auto mieten"
          - "`L'assicurazione è inclusa?` - Ist die Versicherung inbegriffen?"
          - "`Dove devo riconsegnare la macchina?` - Wo muss ich das Auto
            zurückgeben?"
          - "`Dove posso parcheggiare?` - Wo kann ich parken?"
          - "`Il parcheggio è a pagamento?` - Ist der Parkplatz
            gebührenpflichtig?"
          - "`Posso entrare in questa zona con la macchina?` - Darf ich mit dem
            Auto in diese Zone fahren?"
          - "`Dov'è il distributore più vicino?` - Wo ist die nächste
            Tankstelle?"
          - "`La macchina non parte` - Das Auto springt nicht an"
          - "`Può chiamare il soccorso stradale?` - Können Sie den Pannendienst
            rufen?"
      - title: Unterkunft buchen & Ankommen
        items:
          - "`Avete una camera libera per due persone?` - Haben Sie ein freies
            Zimmer für zwei Personen?"
          - "`Vorrei una camera per tre notti` - Ich hätte gern ein Zimmer für
            drei Nächte"
          - "`Quanto costa a notte?` - Wie viel kostet es pro Nacht?"
          - "`La colazione è inclusa?` - Ist das Frühstück inbegriffen?"
          - "`La tassa di soggiorno è inclusa nel prezzo?` - Ist die Kurtaxe im
            Preis inbegriffen?"
          - "`Ho una prenotazione a nome ...` - Ich habe eine Reservierung auf
            den Namen ..."
          - "`Ecco il mio documento d'identità` - Hier ist mein Ausweis"
          - "`A che ora è pronta la camera?` - Um wie viel Uhr ist das Zimmer
            fertig?"
          - "`Posso lasciare qui i bagagli?` - Kann ich mein Gepäck hier lassen?"
      - title: Im Hotel & In der Ferienwohnung
        items:
          - "`Qual è la password del Wi-Fi?` - Wie lautet das WLAN-Passwort?"
          - "`A che ora si fa colazione?` - Um wie viel Uhr gibt es Frühstück?"
          - "`Come funziona l'aria condizionata?` - Wie funktioniert die
            Klimaanlage?"
          - "`Non c'è acqua calda` - Es gibt kein warmes Wasser"
          - "`L'aria condizionata non funziona` - Die Klimaanlage funktioniert
            nicht"
          - "`Mi servono due asciugamani, per favore` - Ich brauche bitte zwei
            Handtücher"
          - "`Posso avere un'altra coperta?` - Kann ich noch eine Decke haben?"
          - "`La camera è troppo rumorosa. Posso cambiarla?` - Das Zimmer ist zu
            laut. Kann ich es wechseln?"
          - "`Entro che ora dobbiamo lasciare la camera?` - Bis wann müssen wir
            das Zimmer verlassen?"
      - title: Im Restaurant
        items:
          - "`Vorrei prenotare un tavolo per due alle otto` - Ich möchte einen
            Tisch für zwei um acht Uhr reservieren"
          - "`Avete un tavolo libero per stasera?` - Haben Sie für heute Abend
            einen Tisch frei?"
          - "`Possiamo sederci fuori?` - Können wir draußen sitzen?"
          - "`Possiamo vedere il menù, per favore?` - Können wir bitte die
            Speisekarte sehen?"
          - "`Quali piatti regionali ci consiglia?` - Welche regionalen Gerichte
            empfehlen Sie uns?"
          - "`Per me una pizza margherita, per favore` - Für mich bitte eine
            Pizza Margherita"
          - "`Vorrei un contorno di verdure grigliate` - Ich hätte gern
            gegrilltes Gemüse als Beilage"
          - "`Possiamo avere ancora un po' di pane?` - Können wir noch etwas
            Brot bekommen?"
          - "`Mi scusi, questo non è il piatto che ho ordinato` -
            Entschuldigung, das ist nicht das Gericht, das ich bestellt habe"
          - "`Era tutto buonissimo, grazie!` - Es war alles sehr lecker, danke!"
      - title: Bar, Frühstück & Eis
        items:
          - "`Vorrei un cappuccino e un cornetto` - Ich hätte gern einen
            Cappuccino und ein Croissant"
          - "`Un caffè decaffeinato, per favore` - Einen entkoffeinierten
            Espresso, bitte"
          - "`Avete latte d'avena?` - Haben Sie Hafermilch?"
          - "`Un bicchiere d'acqua naturale, per favore` - Ein Glas stilles
            Wasser, bitte"
          - "`Una bottiglia d'acqua frizzante, per favore` - Eine Flasche
            Sprudelwasser, bitte"
          - "`Vorrei un aperitivo analcolico` - Ich hätte gern einen
            alkoholfreien Aperitif"
          - "`Da portare via, per favore` - Zum Mitnehmen, bitte"
          - "`Vorrei un cono con due gusti: limone e fragola` - Ich hätte gern
            eine Eiswaffel mit zwei Sorten: Zitrone und Erdbeere"
          - "`Preferisco una coppetta` - Ich hätte lieber einen Eisbecher"
          - "`Basta così, grazie` - Das ist alles, danke"
      - title: Vorlieben & Allergien
        items:
          - "`Avete piatti vegetariani o vegani?` - Haben Sie vegetarische oder
            vegane Gerichte?"
          - "`Non mangio carne né pesce` - Ich esse weder Fleisch noch Fisch"
          - "`Questo piatto contiene latte o uova?` - Enthält dieses Gericht
            Milch oder Eier?"
          - "`Ho una grave allergia alle arachidi` - Ich habe eine schwere
            Erdnussallergie"
          - "`Anche piccole tracce possono essere pericolose per me` - Auch
            kleine Spuren können für mich gefährlich sein"
          - "`Potete prepararlo senza contaminazione da arachidi?` - Können Sie
            es ohne Verunreinigung durch Erdnüsse zubereiten?"
          - "`Devo evitare il glutine. Avete piatti adatti?` - Ich muss Gluten
            meiden. Haben Sie geeignete Gerichte?"
          - "`È piccante? Lo preferisco non piccante` - Ist es scharf? Ich hätte
            es lieber nicht scharf"
          - "`Senza formaggio, per favore` - Ohne Käse, bitte"
        tip:
          description:
            "**Wichtig:** Bei Allergien das konkrete Allergen nennen. `Non mi
            piace ...` bedeutet nur »Ich mag ... nicht« und beschreibt keine
            Allergie."
      - title: Bezahlen
        items:
          - "`Il conto, per favore` - Die Rechnung, bitte"
          - "`Possiamo pagare separatamente?` - Können wir getrennt bezahlen?"
          - "`Posso pagare con la carta?` - Kann ich mit Karte bezahlen?"
          - "`Pago in contanti` - Ich zahle bar"
          - "`Il servizio è incluso?` - Ist der Service inbegriffen?"
          - "`Quanto costa il coperto a persona?` - Wie viel kostet das Gedeck
            pro Person?"
          - "`Mi scusi, credo che ci sia un errore nel conto` - Entschuldigung,
            ich glaube, in der Rechnung ist ein Fehler"
          - "`Posso avere lo scontrino?` - Kann ich den Kassenbon bekommen?"
          - "`Dove posso prelevare contanti?` - Wo kann ich Bargeld abheben?"
      - title: Auf dem Markt & Im Supermarkt
        items:
          - "`Dov'è il supermercato più vicino?` - Wo ist der nächste
            Supermarkt?"
          - "`A che ora chiudete?` - Um wie viel Uhr schließen Sie?"
          - "`Quanto costano questi pomodori al chilo?` - Wie viel kosten diese
            Tomaten pro Kilo?"
          - "`Vorrei mezzo chilo di pomodori` - Ich hätte gern ein halbes Kilo
            Tomaten"
          - "`Due etti di questo formaggio, per favore` - Zweihundert Gramm von
            diesem Käse, bitte"
          - "`Vorrei un litro d'olio d'oliva` - Ich hätte gern einen Liter
            Olivenöl"
          - "`Posso assaggiare?` - Darf ich probieren?"
          - "`Devo pesare la frutta?` - Muss ich das Obst wiegen?"
          - "`Mi serve un sacchetto, per favore` - Ich brauche bitte eine Tüte"
        tip:
          description:
            "**Tipp:** An der Frischetheke ist `un etto` = 100 Gramm üblich;
            `due etti` = 200 Gramm. `Mezzo chilo` ist ein halbes Kilo."
      - title: Kleidung einkaufen
        items:
          - "`Sto solo guardando, grazie` - Ich schaue nur, danke"
          - "`Cerco una giacca leggera` - Ich suche eine leichte Jacke"
          - "`Posso provare questa giacca?` - Kann ich diese Jacke anprobieren?"
          - "`Dove sono i camerini?` - Wo sind die Umkleidekabinen?"
          - "`Avete una taglia più grande?` - Haben Sie eine größere Größe?"
          - "`Avete una taglia più piccola?` - Haben Sie eine kleinere Größe?"
          - "`Avete questo modello in blu?` - Haben Sie dieses Modell in Blau?"
          - "`Quanto costano questi pantaloni?` - Wie viel kostet diese Hose?"
          - "`Posso cambiarlo se non va bene?` - Kann ich es umtauschen, wenn es
            nicht passt?"
      - title: Sehenswürdigkeiten & Ausflüge
        items:
          - "`Cosa ci consiglia di visitare?` - Was empfehlen Sie uns zu
            besichtigen?"
          - "`Il museo è aperto oggi?` - Ist das Museum heute geöffnet?"
          - "`Quanto costa l'ingresso?` - Wie viel kostet der Eintritt?"
          - "`Ci sono riduzioni per bambini?` - Gibt es Ermäßigungen für Kinder?"
          - "`Bisogna prenotare in anticipo?` - Muss man im Voraus buchen?"
          - "`Avete un'audioguida in tedesco?` - Haben Sie einen Audioguide auf
            Deutsch?"
          - "`Quanto dura la visita?` - Wie lange dauert die Besichtigung?"
          - "`Si possono fare fotografie?` - Darf man fotografieren?"
          - "`Può farci una foto, per favore?` - Können Sie bitte ein Foto von
            uns machen?"
      - title: Strand, Camping & Natur
        items:
          - "`Dov'è la spiaggia libera più vicina?` - Wo ist der nächste frei
            zugängliche Strand?"
          - "`Quanto costano un ombrellone e due lettini?` - Wie viel kosten ein
            Sonnenschirm und zwei Liegen?"
          - "`È sicuro fare il bagno qui?` - Ist es hier sicher zu baden?"
          - "`Ci sono docce e bagni?` - Gibt es Duschen und Toiletten?"
          - "`Avete una piazzola libera per una tenda?` - Haben Sie einen freien
            Stellplatz für ein Zelt?"
          - "`L'elettricità è inclusa nel prezzo?` - Ist Strom im Preis
            inbegriffen?"
          - "`L'acqua è potabile?` - Ist das Wasser trinkbar?"
          - "`Questo sentiero porta al lago?` - Führt dieser Wanderweg zum See?"
          - "`Quanto dura il percorso?` - Wie lange dauert die Strecke?"
      - title: Wetter & Pläne
        items:
          - "`Che tempo fa oggi?` - Wie ist das Wetter heute?"
          - "`Domani pioverà?` - Wird es morgen regnen?"
          - "`Oggi fa molto caldo` - Heute ist es sehr heiß"
          - "`C'è troppo vento per andare in barca` - Es ist zu windig, um mit
            dem Boot zu fahren"
          - "`Se piove, andiamo al museo` - Wenn es regnet, gehen wir ins Museum"
          - "`Domani vorremmo andare in montagna` - Morgen würden wir gern in
            die Berge fahren"
          - "`Preferiamo restare in spiaggia` - Wir bleiben lieber am Strand"
          - "`Dove possiamo noleggiare due biciclette?` - Wo können wir zwei
            Fahrräder mieten?"
      - title: Ins Gespräch kommen
        items:
          - "`Siamo in vacanza qui per una settimana` - Wir machen hier eine
            Woche Urlaub"
