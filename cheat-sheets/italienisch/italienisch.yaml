          - "`Dov'è il bagno?` - Wo ist die Toilette?"
        tip:
          description:
            "**Tipp:** Bei `piacere` ist das Gemochte das Subjekt: `Mi piace la
            pizza` (Einzahl), aber `Mi piacciono gli spaghetti` (Mehrzahl)."
